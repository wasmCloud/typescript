header:
  schema-version: 2.2.0
  last-updated: '2026-11-02'
  last-reviewed: '2026-10-30'
  url: https://raw.githubusercontent.com/wasmCloud/typescript/main/security-insights.yml
  project-si-source: https://raw.githubusercontent.com/wasmCloud/wasmCloud/main/security-insights.yml
  comment: >-
    Repository-level data for wasmCloud/typescript. Project-level data,
    including vulnerability reporting, is in the wasmCloud/wasmCloud file above.

repository:
  url: https://github.com/wasmCloud/typescript
  status: active
  accepts-change-request: true
  accepts-automated-change-request: true
  core-team:
    - name: wasmCloud TypeScript maintainers (@wasmCloud/typescript-maintainers)
      social: https://github.com/wasmCloud/.project/blob/main/maintainers.yaml
      primary: true
  license:
    url: https://github.com/wasmCloud/typescript/blob/main/LICENSE
    expression: Apache-2.0
  documentation:
    contributing-guide: https://github.com/wasmCloud/typescript/blob/main/CONTRIBUTING.md
    governance: https://github.com/wasmCloud/wasmCloud/blob/main/GOVERNANCE.md
    security-policy: https://github.com/wasmCloud/.github/blob/main/SECURITY.md
  security:
    assessments:
      self:
        name: wasmCloud security self-assessment
        evidence: https://github.com/wasmCloud/wasmCloud/blob/main/SELF_ASSESSMENT.md
        date: '2026-10-27'
        comment: >-
          The wasmCloud project self-assessment. The threat model it refers to,
          wasmCloud/wasmCloud THREAT_MODEL.md, covers the host sandbox that
          the TypeScript examples and templates run in.
    tools:
      - name: CodeQL
        type: SAST
        comment: >-
          Analyzes the TypeScript and JavaScript sources and the GitHub Actions
          workflows on every pull request, on pushes to main and weekly. A pull
          request that adds a high or critical severity alert is blocked from
          merging; see CONTRIBUTING.md#code-scanning.
        rulesets:
          - security-extended
        integration:
          adhoc: false
          ci: true
          release: false
        results:
          ci:
            name: CodeQL analysis
            predicate-uri: https://codeql.github.com
            location: https://github.com/wasmCloud/typescript/security/code-scanning
      - name: Dependabot
        type: SCA
        comment: Dependabot alerts and security-update PRs, plus version updates for npm and GitHub Actions.
        rulesets:
          - default
        integration:
          adhoc: true
          ci: false
          release: false
        results: {}
