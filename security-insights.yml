header:
  schema-version: 2.2.0
  last-updated: '2026-11-05'
  last-reviewed: '2026-10-30'
  url: https://raw.githubusercontent.com/wasmCloud/typescript/main/security-insights.yml
  project-si-source: https://raw.githubusercontent.com/wasmCloud/wasmCloud/main/security-insights.yml
  comment: >-
    Repository-level data for wasmCloud/typescript. Project-level data,
    including vulnerability reporting, is in the wasmCloud/wasmCloud file above.

repository:
  url: https://github.com/wasmCloud/typescript
  status: active
  accepts-change-request: true
  accepts-automated-change-request: true
  core-team:
    - name: wasmCloud TypeScript maintainers (@wasmCloud/typescript-maintainers)
      social: https://github.com/wasmCloud/typescript/blob/main/MAINTAINERS.md
      primary: true
  license:
    url: https://github.com/wasmCloud/typescript/blob/main/LICENSE
    expression: Apache-2.0
  documentation:
    contributing-guide: https://github.com/wasmCloud/typescript/blob/main/CONTRIBUTING.md
    dependency-management-policy: https://github.com/wasmCloud/typescript/blob/main/CONTRIBUTING.md#dependencies
    governance: https://github.com/wasmCloud/wasmCloud/blob/main/GOVERNANCE.md
    review-policy: https://github.com/wasmCloud/typescript/blob/main/CONTRIBUTING.md#reviews
    security-policy: https://github.com/wasmCloud/typescript/blob/main/SECURITY.md
  release:
    automated-pipeline: true
    distribution-points:
      - uri: https://github.com/wasmCloud/typescript/releases
        comment: >-
          vX.Y.Z GitHub Releases of the examples and templates on main, cut by
          .github/workflows/release.yml. Each carries a git archive source
          tarball, its SPDX SBOM, an OpenVEX document, SHA256SUMS and their Sigstore bundles. The
          earlier washboard-ui and @wasmcloud/* releases are legacy releases:
          wasmCloud 1.x packages from the v1 branch, cut before SBOMs were
          attached, and end of life. They have no SBOM and won't get one; see
          SUPPORT.md.
      - uri: https://github.com/wasmCloud/typescript/tags
        comment: >-
          The vX.Y.Z git tags, for `wash new --subfolder templates/<name> --git-ref vX.Y.Z`.
    changelog: https://github.com/wasmCloud/typescript/releases/tag/v{version}
    attestations:
      - name: SLSA build provenance
        location: https://github.com/wasmCloud/typescript/attestations
        predicate-uri: https://slsa.dev/provenance/v1
        comment: >-
          Covers the source tarball, the SBOM and SHA256SUMS of each release.
          Verify with `gh attestation verify <file> --repo wasmCloud/typescript`.
      - name: SPDX SBOM
        location: https://github.com/wasmCloud/typescript/attestations
        predicate-uri: https://spdx.dev/Document/v2.3
        comment: >-
          Generated by Syft from the package-lock.json files in the source
          tarball and attested against it. Verify with `gh attestation verify
          <tarball> --repo wasmCloud/typescript --predicate-type https://spdx.dev/Document/v2.3`.
  security:
    assessments:
      self:
        name: wasmCloud TypeScript security self-assessment
        evidence: https://github.com/wasmCloud/typescript/blob/main/SECURITY_ASSESSMENT.md
        date: '2026-11-05'
        comment: >-
          A threat model and attack surface analysis of this repository's
          templates, CI and releases: the assets at stake, the ways outside
          code reaches them, the threats to each and their mitigations, and
          the risks users inherit from the templates. The host sandbox the components
          run in is covered by the wasmCloud self-assessment and
          THREAT_MODEL.md in wasmCloud/wasmCloud.
    tools:
      - name: CodeQL
        type: SAST
        comment: >-
          Analyzes the TypeScript and JavaScript sources and the GitHub Actions
          workflows on every pull request, on pushes to main and weekly. A pull
          request that adds a high or critical severity alert is blocked from
          merging; see CONTRIBUTING.md#code-scanning.
        rulesets:
          - security-extended
        integration:
          adhoc: false
          ci: true
          release: false
        results:
          ci:
            name: CodeQL analysis
            predicate-uri: https://codeql.github.com
            location: https://github.com/wasmCloud/typescript/security/code-scanning
      - name: Dependabot
        type: SCA
        comment: Dependabot alerts and security-update PRs, plus version updates for npm and GitHub Actions.
        rulesets:
          - default
        integration:
          adhoc: true
          ci: false
          release: false
        results: {}
      - name: GitHub secret scanning
        type: secret
        comment: >-
          Secret scanning and push protection are enabled on the repository,
          so a push containing a detected secret is blocked.
        rulesets:
          - default
        integration:
          adhoc: true
          ci: true
          release: false
        results:
          ci:
            name: GitHub secret scanning
            predicate-uri: https://docs.github.com/en/code-security/secret-scanning/introduction/about-secret-scanning
            location: https://github.com/wasmCloud/wasmCloud/blob/main/SECURITY.md#stored-secrets
      - name: OSPS Baseline Scanner (grc.store)
        type: other
        comment: >-
          OSPS Baseline Maturity Level 2 assessment weekly and on demand,
          published to grc.store as a signed log by the publish-results
          workflow.
        rulesets:
          - osps-baseline
        integration:
          adhoc: true
          ci: true
          release: false
        results:
          ci:
            name: OSPS Baseline evaluation
            predicate-uri: https://github.com/revanite-io/pvtr-publish-results
            location: https://grc.store/targets/wasmcloud/typescript
