name: Examples - Component

on:
  workflow_call:
    inputs:
      folder:
        type: string
        description: The folder name of the example component, relative to the ./examples/components folder
        required: true
      wasm-bin:
        type: string
        description: name of the wasm binary found inside the dist folder
        required: true
      checks:
        type: string
        description: JSON array of smoke-test checks for scripts/smoke-test.mjs; empty for a build-only example
        required: false
        default: ''
      skip-wash-dev:
        type: boolean
        description: Whether to skip wash dev testing (true for components tested via transpile+demo)
        required: true
      dist-dir:
        type: string
        description: Directory the wasm binary is built into, relative to the example folder
        required: false
        default: dist
      force:
        type: boolean
        description: Force the build and test steps to run, even if no changes are detected
        required: true

permissions: {}

env:
  COMPONENTIZE_JS_VERSION: 0.23.0
  TEST_RETRIES: 60

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run-build: ${{ steps.force.outputs.force || steps.check-example-changes.outputs.changed == 'true' }}
    steps:
      - name: Force build if needed
        id: force
        if: inputs.force
        run: |
          echo "force=true" >> $GITHUB_OUTPUT

      - name: Checkout
        if: ${{ !inputs.force }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for Example Changes
        id: check-example-changes
        if: ${{ !inputs.force }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            changed:
              - 'examples/components/${{ inputs.folder }}/**'

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [check]
    if: needs.check.outputs.run-build == 'true'
    strategy:
      matrix:
        jco-version:
          - 1.17.6
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # No dependency cache: the Examples workflow also runs on tag pushes,
          # which must not restore a cache a pull request could have poisoned.
          package-manager-cache: false
          node-version-file: './examples/components/${{ inputs.folder }}/.nvmrc'

      - name: Install Wash
        uses: wasmcloud/setup-wash-action@47756fa211cc82f392c57e39504f43ef46fc0b3e # v2.1.0

      - name: Install JS Wasm Tools
        env:
          JCO_VERSION: ${{ matrix.jco-version }}
        run: |
          npm install -g "@bytecodealliance/jco@$JCO_VERSION"
          npm install -g "@bytecodealliance/componentize-js@$COMPONENTIZE_JS_VERSION"

      - name: Build
        working-directory: './examples/components/${{ inputs.folder }}'
        run: npm ci && npm run build

      - name: run tests
        working-directory: './examples/components/${{ inputs.folder }}'
        run: npm run test --if-present

      - name: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.folder }}-wasm-bin
          path: ./examples/components/${{ inputs.folder }}/${{ inputs.dist-dir }}/${{ inputs.wasm-bin }}

  test:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        jco-version:
          - 1.17.6
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: './examples/components/${{ inputs.folder }}/.nvmrc'
          package-manager-cache: false

      - name: Install JS Wasm Tools
        if: ${{ inputs.skip-wash-dev }}
        env:
          JCO_VERSION: ${{ matrix.jco-version }}
        run: npm install -g "@bytecodealliance/jco@$JCO_VERSION"

      - name: Install Wash
        uses: wasmcloud/setup-wash-action@47756fa211cc82f392c57e39504f43ef46fc0b3e # v2.1.0

      - name: Download wasm-bin
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.folder }}-wasm-bin
          path: ./examples/components/${{ inputs.folder }}/${{ inputs.dist-dir }}/

      - name: Install dependencies
        if: inputs.checks != ''
        working-directory: './examples/components/${{ inputs.folder }}'
        run: npm ci

      - name: Transpile
        if: inputs.checks != '' && inputs.skip-wash-dev
        working-directory: './examples/components/${{ inputs.folder }}'
        run: npm run transpile

      - name: Start wash dev
        if: ${{ !inputs.skip-wash-dev }}
        working-directory: './examples/components/${{ inputs.folder }}'
        run: wash dev --non-interactive &

      - name: Smoke test
        if: inputs.checks != ''
        working-directory: './examples/components/${{ inputs.folder }}'
        env:
          CHECKS: ${{ inputs.checks }}
          RETRIES: ${{ env.TEST_RETRIES }}
        run: node ../../../scripts/smoke-test.mjs

      - name: Cleanup
        if: ${{ always() && !inputs.skip-wash-dev }}
        run: pkill -f "wash dev" || true
