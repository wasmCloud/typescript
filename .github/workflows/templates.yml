name: Templates

# Builds every template in templates/ the way `wash new` users do:
# `npm ci` and `npm run build`.
# Templates with an HTTP entry point then run under `wash dev`,
# and a request to them must return the expected body.

on:
  push:
    branches:
      - main
    tags:
      - '**'
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  meta:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.changes.outputs.templates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for changes
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            templates:
              - 'templates/**'
              - '.github/workflows/templates.yml'

  template:
    name: Template (${{ matrix.template.folder }})
    needs: [meta]
    if: needs.meta.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        template:
          - folder: http-hello-world-fetch
            test-path: /
            test-expect: Hello from TypeScript!
          - folder: http-hello-world-hono
            test-path: /
            test-expect: Hello from TypeScript!
          - folder: http-client
            test-path: /
            test-expect: outgoing HTTP requests
          - folder: http-handler-hono
            test-path: /health
            test-expect: '"status":"healthy"'
          - folder: http-logging-handler-hono
            test-path: /health
            test-expect: '"status":"healthy"'
          - folder: http-kv-handler-hono
            test-path: /health
            test-expect: '"status":"healthy"'
          - folder: http-blobstore-handler-hono
            test-path: /health
            test-expect: '"status":"healthy"'
          - folder: http-filesystem-handler-hono
            # wash dev mounts ./data at /data.
            prepare: mkdir -p data
            test-path: /
            test-expect: '"path":"/data"'
          # Multi-component workspaces: build only.
          - folder: http-api-with-distributed-workloads
          - folder: service-tcp-echo
    defaults:
      run:
        working-directory: templates/${{ matrix.template.folder }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          # No dependency cache: this workflow also runs on tag pushes, and a
          # poisoned cache must not reach a release build.
          package-manager-cache: false

      - name: Install Wash
        uses: wasmcloud/setup-wash-action@47756fa211cc82f392c57e39504f43ef46fc0b3e # v2.1.0

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare
        if: matrix.template.prepare != ''
        env:
          PREPARE: ${{ matrix.template.prepare }}
        run: eval "$PREPARE"

      - name: Start wash dev
        if: matrix.template.test-path != ''
        run: wash dev --non-interactive > "$RUNNER_TEMP/wash-dev.log" 2>&1 &

      - name: Test
        if: matrix.template.test-path != ''
        env:
          TEST_PATH: ${{ matrix.template.test-path }}
          TEST_EXPECT: ${{ matrix.template.test-expect }}
        run: |
          set -u
          body=''
          for _ in $(seq 1 180); do
            if body=$(curl -sf "http://127.0.0.1:8000$TEST_PATH") && grep -qF -- "$TEST_EXPECT" <<<"$body"; then
              echo "✅ GET $TEST_PATH returned the expected body"
              exit 0
            fi
            sleep 1
          done
          echo "❌ GET $TEST_PATH did not return '$TEST_EXPECT'. Last body:"
          echo "$body"
          echo "--- wash dev log"
          cat "$RUNNER_TEMP/wash-dev.log"
          exit 1

      - name: Stop wash dev
        if: always() && matrix.template.test-path != ''
        run: pkill -f "wash dev" || true

  # The required check for this workflow. It runs even when a job above fails
  # or is skipped, and fails if any of them failed.
  templates-check:
    needs: [meta, template]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail if a job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
