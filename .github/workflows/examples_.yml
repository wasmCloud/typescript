name: Examples

on:
  push:
    branches:
      - main
    tags:
      - '**'
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  meta:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed-components: ${{ steps.changes.outputs.components }}
      changed-ci: ${{ steps.changes.outputs.ci }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for changes
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            ci:
              - '.github/workflows/examples_.yml'
              - '.github/workflows/examples_component.yml'
            components:
              - 'examples/components/**'


  components:
    name: Example (${{ matrix.example.folder }})
    if: needs.meta.outputs.changed-ci == 'true' || needs.meta.outputs.changed-components == 'true'
    needs: [meta]
    # The called workflow's jobs can use at most these permissions.
    permissions:
      contents: read
    uses: $/.github/workflows/examples_component.yml
    with:
      folder: ${{ matrix.example.folder }}
      wasm-bin: ${{ matrix.example.wasm-bin }}
      test-command: ${{ matrix.example.test-command }}
      skip-wash-dev: ${{ matrix.example.skip-wash-dev && true || false }}
      dist-dir: ${{ matrix.example.dist-dir || 'dist' }}
      force: ${{ needs.meta.outputs.changed-ci == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        example:
          - folder: http-password-checker
            wasm-bin: http-password-checker.wasm
            test-command: |
              RESPONSE=$(curl http://127.0.0.1:8000/api/v1/check -d '{"value": "test"}' | jq -r '.status' || echo '')
              [[ "$RESPONSE" == 'success' ]] && TEST_RESULT=1 || TEST_RESULT=0

          - folder: http-server-with-hono
            wasm-bin: http_server_with_hono.wasm
            test-command: |
              EXPECTED_DATA="This is some JSON data."
              RESPONSE_DATA=$(curl http://127.0.0.1:8000/api/data | jq -r '.message')
              [[ "$RESPONSE_DATA" == "$EXPECTED_DATA" ]] && TEST_DATA=1 || TEST_DATA=0

              EXPECTED_CONFIG='{"theme":"dark","version":"1.0.0","features":["logging","metrics"]}'
              RESPONSE_CONFIG=$(curl http://127.0.0.1:8000/api/config)
              [[ "$RESPONSE_CONFIG" == "$EXPECTED_CONFIG" ]] && TEST_CONFIG=1 || TEST_CONFIG=0

              [[ "$TEST_DATA" == '1' && "$TEST_CONFIG" == '1' ]] && TEST_RESULT=1 || TEST_RESULT=0

          - folder: http-streaming
            wasm-bin: http-streaming.wasm
            test-command: |
              RESPONSE=$(curl http://127.0.0.1:8000 | base64 -d | wc -c)
              [[ "$RESPONSE" == '1048576' ]] && TEST_RESULT=1 || TEST_RESULT=0

          - folder: bundled-rsbuild
            wasm-bin: bundled-rsbuild.wasm
            skip-wash-dev: true
            test-command: |
              npm ci && npm run transpile
              RESPONSE=$(npm run --silent demo)
              [[ "$RESPONSE" == '15' ]] && TEST_RESULT=1 || TEST_RESULT=0

          - folder: bundled-esbuild
            wasm-bin: bundled-esbuild.wasm
            skip-wash-dev: true
            test-command: |
              npm ci && npm run transpile
              RESPONSE=$(npm run --silent demo)
              [[ "$RESPONSE" == '8' ]] && TEST_RESULT=1 || TEST_RESULT=0

          - folder: http-axios
            wasm-bin: http-axios.wasm
            skip-wash-dev: true
            test-command: |
              npm ci && npm run transpile
              RESPONSE=$(npm run --silent demo | jq -r '.id')
              [[ "$RESPONSE" == '1' ]] && TEST_RESULT=1 || TEST_RESULT=0

          - folder: http-hello-world
            wasm-bin: http-hello-world.wasm
            test-command: |
              RESPONSE=$(curl http://127.0.0.1:8000)
              [[ "$RESPONSE" == 'Hello from Typescript!' ]] && TEST_RESULT=1 || TEST_RESULT=0

          - folder: http-stdio
            wasm-bin: http_stdout.wasm
            test-command: |
              RESPONSE=$(curl 'http://127.0.0.1:8000/?name=ci')
              [[ "$RESPONSE" == 'Hello ci!' ]] && TEST_RESULT=1 || TEST_RESULT=0

          - folder: wasi-config-from-k8s-env
            wasm-bin: wasi_config_from_k8s_env.wasm
            test-command: |
              RESPONSE=$(curl http://127.0.0.1:8000)
              [[ "$RESPONSE" == 'wasi-config-from-k8s-env example'* ]] && TEST_RESULT=1 || TEST_RESULT=0

          # Build-only: wash dev runs the service on wasi:webgpu,
          # which needs a GPU the runners don't have.
          - folder: webgpu-tensorflow
            wasm-bin: component.wasm
            dist-dir: component/dist
            skip-wash-dev: true
            test-command: ''

          # Docs companion for the wasmcloud.com quickstart's "Add persistent
          # storage" step. Build-only: skip-wash-dev: true because the
          # component imports wasi:keyvalue at runtime and wash dev doesn't
          # auto-provision a keyvalue provider in CI. The build pass is what
          # catches template/world.wit/jco-std drift, which is the point.
          - folder: http-hello-world-hono-persistent-storage
            wasm-bin: http_hello_world_hono_persistent_storage.wasm
            skip-wash-dev: true
            test-command: ''

  # The required check for this workflow. It runs even when a job above fails
  # or is skipped, and fails if any of them failed.
  examples-check:
    needs: [meta, components]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
