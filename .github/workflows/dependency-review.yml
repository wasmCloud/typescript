name: Dependency review

# Blocks a pull request that adds or updates a dependency to a version with a
# known vulnerability in the GitHub Advisory Database, at any severity and in
# any scope, or to an npm version the database lists as malware.
# The policy is in CONTRIBUTING.md#vulnerable-dependencies.

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          # Licenses are checked before each release instead; see
          # CONTRIBUTING.md#vulnerable-dependencies.
          license-check: false
          # Advisories that don't affect this project, each with a statement
          # in vex.openvex.json. Keep this list empty unless a vulnerable
          # version can't be avoided.
          allow-ghsas: ''

      # The step above checks vulnerability advisories. This one checks the
      # Advisory Database's malware advisories, which have no exceptions.
      - name: Check for malware
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-malware.mjs
